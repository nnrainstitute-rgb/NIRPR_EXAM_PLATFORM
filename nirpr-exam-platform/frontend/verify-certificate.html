<!doctype html><html lang="en"><head>
<link rel="icon" type="image/jpeg" href="/static/images/nnra-logo.jpg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify NIRPR Certificate</title><link rel="stylesheet" href="/static/css/style.css"></head><body>
<div class="topbar"><div class="brand"><div class="crest"><img src="/static/images/nnra-logo.jpg" alt="NNRA logo"></div><div>NIRPR Certificate Verification<div class="brand-sub">Public verification portal</div></div></div></div>
<main class="container narrow"><div class="card"><h1>Verify a certificate</h1><p class="subtitle">Enter the number printed on the certificate or scan its QR code.</p><form id="verifyForm"><label>Certificate number</label><input id="certificateNumber" required placeholder="NIRPR/NTC/RSO/COURSE-CODE/2026/0003"><button class="btn block">Verify</button></form><div id="result" style="margin-top:18px"></div></div></main>
<script>const input=document.getElementById('certificateNumber'),result=document.getElementById('result');input.value=new URLSearchParams(location.search).get('number')||'';async function verify(e){e?.preventDefault();result.innerHTML='<p>Checking…</p>';const r=await fetch(`/api/certificates/verify/${encodeURIComponent(input.value.trim())}${new URLSearchParams(location.search).get('attempt_id') ? '?attempt_id='+encodeURIComponent(new URLSearchParams(location.search).get('attempt_id')) : ''}`),d=await r.json();result.innerHTML=r.ok?`<div class="alert success"><h2>Valid certificate</h2><p><strong>${d.candidate}</strong></p><p>${d.programme} — ${d.exam}</p><p>Certificate: ${d.certificate_number}<br>Issued: ${new Date(d.issued_at).toLocaleDateString()}</p></div>`:`<div class="alert error">${d.detail||'Certificate could not be verified.'}</div>`;}document.getElementById('verifyForm').onsubmit=verify;if(input.value)verify();</script></body></html>
